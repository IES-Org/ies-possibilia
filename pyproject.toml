[tool.poetry]
name = "ies-sdnp-possibilia"
version = "0.1.0"
description = "IES SDNP Possibilia ontology module"
authors = ["IES Development Community", ]
readme = "README.md"
packages = [{include = "ies_tools"}]
repository = "https://github.com/IES-Org/ies-sdnp-possibilia"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.3"
rdflib = "^7.1.3"
pyshacl = "^0.30.0"
setuptools = "^68.0.0"
wheel = "^0.40.0"

[tool.poetry.scripts]
ies-build = "ies_tools.src.build.build:cli"
gh-tools = "ies_tools.src.github_tools.github:cli"
domain-range-checker = "ies_tools.src.domain-range-checker.data_domain_range_use:main"
kpi-runner = "ies_tools.src.kpi_runner.ontology_kpi_test_runner:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
mypy = "^1.13.0"
types-pyyaml = "^6.0.12.20240917"
types-redis = "^4.6.0.20241004"
types-requests = "^2.32.0.20241016"
black = "^24.10.0"
isort = "^5.13.2"
pylint = "^2.17.3"
pytest-flask = "^1.3.0"
pytest = "^8.3.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# Core MkDocs and Material theme
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.3"
mkdocs-material-extensions = "^1.3.1"

# Essential plugins
mkdocs-git-revision-date-localized-plugin = "^1.2.2"
mkdocs-minify-plugin = "^0.7.1"
pymdown-extensions = "^10.16.1"

# PDF generation - primary method
mkdocs-with-pdf = "^0.9.3"
weasyprint = "^60.0"

# PDF generation - alternative method
mkdocs-print-site-plugin = "^2.3.4"

# Content enhancement plugins
mkdocs-include-markdown-plugin = "^6.0.4"
mkdocs-mermaid2-plugin = "^1.1.1"
mkdocs-redirects = "^1.2.0"
mkdocs-awesome-pages-plugin = "^2.9.0"
mkdocs-macros-plugin = "^1.0.0"

# Git integration plugins
mkdocs-git-committers-plugin-2 = "^2.2.0"

# Validation and quality plugins
mkdocs-htmlproofer-plugin = "^1.0.0"

# Additional dependencies for plugins
lxml = "^4.9.0"

[tool.isort]
profile = "black"
line_length = 80

[tool.black]
line-length = 80

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
